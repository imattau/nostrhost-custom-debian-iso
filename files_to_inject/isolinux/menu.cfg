menu hshift 11
menu width 57

menu title NostrHost installation 

menu background splash.png
menu color title	* #FFFFFFFF *
menu color border	* #00000000 #00000000 none
menu color sel		* #ffffffff #8b5cf6ff *
menu color hotsel	1;7;37;40 #ffffffff #8b5cf6ff *
menu color tabmsg	* #ffffffff #00000000 *
menu color help		37;40 #ffdddd00 #00000000 none
menu vshift 16
menu rows 7
menu helpmsgrow 12
menu cmdlinerow 12
menu tabmsgrow 13
menu tabmsg

default installgui_new
label installgui_new
	menu label ^Graphical install - New Node (recommended)
	menu default
	kernel /install.__ARCH__/vmlinuz
	append  preseed/file=/cdrom/preseeds/new.preseed video=vesa:ywrap,mtrr vga=788 initrd=/install.__ARCH__/gtk/initrd.gz -- quiet

label installgui_restore
	menu label ^Graphical install - Restore Node
	kernel /install.__ARCH__/vmlinuz
	append  preseed/file=/cdrom/preseeds/restore.preseed video=vesa:ywrap,mtrr vga=788 initrd=/install.__ARCH__/gtk/initrd.gz -- quiet

label install_new
	menu label ^Text install - New Node
	kernel /install.__ARCH__/vmlinuz
	append  preseed/file=/cdrom/preseeds/new.preseed vga=788 initrd=/install.__ARCH__/initrd.gz -- quiet

label install_restore
	menu label ^Text install - Restore Node
	kernel /install.__ARCH__/vmlinuz
	append  preseed/file=/cdrom/preseeds/restore.preseed vga=788 initrd=/install.__ARCH__/initrd.gz -- quiet
