if [ x$feature_default_font_path = xy ] ; then
   font=unicode
else
   font=$prefix/font.pf2
fi

if loadfont $font ; then
  set gfxmode=800x600
  set gfxpayload=keep
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod gfxterm
  insmod png
  terminal_output gfxterm
fi

if background_image /isolinux/splash.png; then
  set color_normal=light-gray/black
  set color_highlight=white/purple
elif background_image /splash.png; then
  set color_normal=light-gray/black
  set color_highlight=white/purple
else
  set menu_color_normal=light-gray/black
  set menu_color_highlight=white/purple
fi

insmod play
play 960 440 1 0 4 440 1
set theme=/boot/grub/theme/nostrhost
menuentry --hotkey=n 'Graphical install - New Node (recommended)' {
    set background_color=black
    linux    /install.__ARCH__/vmlinuz preseed/file=/cdrom/preseeds/new.preseed vga=788 --- quiet
    initrd   /install.__ARCH__/gtk/initrd.gz
}
menuentry --hotkey=r 'Graphical install - Restore Node' {
    set background_color=black
    linux    /install.__ARCH__/vmlinuz preseed/file=/cdrom/preseeds/restore.preseed vga=788 --- quiet
    initrd   /install.__ARCH__/gtk/initrd.gz
}
menuentry --hotkey=t 'Text install - New Node' {
    set background_color=black
    linux    /install.__ARCH__/vmlinuz preseed/file=/cdrom/preseeds/new.preseed vga=788 --- quiet
    initrd   /install.__ARCH__/initrd.gz
}
menuentry --hotkey=e 'Text install - Restore Node' {
    set background_color=black
    linux    /install.__ARCH__/vmlinuz preseed/file=/cdrom/preseeds/restore.preseed vga=788 --- quiet
    initrd   /install.__ARCH__/initrd.gz
}
menuentry --hotkey=s 'Graphical install with speech synthesis' {
    set background_color=black
    linux    /install.__ARCH__/vmlinuz preseed/file=/cdrom/preseeds/new.preseed vga=788 speakup.synth=soft --- quiet
    initrd   /install.__ARCH__/gtk/initrd.gz
}
menuentry --hotkey=d 'Graphical install with accessible dark contrast' {
    set background_color=black
    linux    /install.__ARCH__/vmlinuz preseed/file=/cdrom/preseeds/new.preseed vga=788 theme=dark --- quiet
    initrd   /install.__ARCH__/gtk/initrd.gz
}
